<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Lwandle Kyle Bayanda Hlongwa">
    <meta name="description" content="This is a meticulously crafted webpage for submitting product reviews.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get" class="wf1">
            <fieldset>
                <legend>Product Details</legend>

                <label for="productName">Product Name
                    <select name="product" id="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </label>

                <div class="rating-group">
                    <span class="field-label">Overall Rating</span>
                    <div class="rating-options">
                        <label for="rating1">☆<input type="radio" name="rating" id="rating1" value="1" required></label>
                        <label for="rating2">☆☆<input type="radio" name="rating" id="rating2" value="2" required></label>
                        <label for="rating3">☆☆☆<input type="radio" name="rating" id="rating3" value="3" required></label>
                        <label for="rating4">☆☆☆☆<input type="radio" name="rating" id="rating4" value="4" required></label>
                        <label for="rating5">☆☆☆☆☆<input type="radio" name="rating" id="rating5" value="5" required></label>
                    </div>
                </div>

                <label for="installDate">Date of Installation
                    <input type="date" name="installDate" id="installDate" required>
                </label>

                <div class="features">
                    <span class="field-label">Useful Features <small>(Check all that apply)</small></span>
                    <label><input type="checkbox" name="features" id="durability" value="Durability">Durability</label>
                    <label><input type="checkbox" name="features" id="ease" value="Ease of Use">Ease of Use</label>
                    <label><input type="checkbox" name="features" id="performance" value="Performance">Performance</label>
                    <label><input type="checkbox" name="features" id="design" value="Design">Design</label>
                </div>

                <label for="writtenReview">Written Review <small>(Optional)</small>
                    <textarea name="writtenReview" id="writtenReview" rows="5"></textarea>
                </label>

                <label for="userName">Your Name <small>(Optional)</small>
                    <input type="text" name="userName" id="userName">
                </label>

                <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Lwandle Kyle Bayanda Hlongwa | South Africa</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
