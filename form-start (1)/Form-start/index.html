<main>
    <h1>Course Proposal Application</h1>
        <form method="get" action="thanks.html" class="wf1">
            <fieldset>
                <legend>Applicant Information</legend>
                <label>First Name* <input type="text" name="fname" id="" required></label>
                <label>Last Name* <input type="text" name="lname" id="" required></label>
                <label>Phone <input type="tel" name="phone" id="" placeholder="123456789"></label>
                <label>Email* <input type="email" name="email" id="" required placeholder="user@example.com"></label>
                <label>Website <input type="url" name="website" id="" placeholder="http://"></label>
            </fieldset>
            
            <fieldset>
                <legend>Couse Information</legend>
                <label><input type="radio" name="audience" id="" value="beginner">Beginner</label>
                <label><input type="radio" name="audience" id="" value="intermediate">Intermediate</label>
                <label><input type="radio" name="audience" id="" value="advanced">Advanced</label>

                <div>Software Needed</div>
                <label><input type="checkbox" name="editing" id="" value="yes">Photo Editing</label>
                <label><input type="checkbox" name="code" id="" value="yes">Coding</label>
                <label><input type="checkbox" name="process" id="" value="yes">Preprocessor</label>
                <label><input type="checkbox" name="client" id="" value="yes">FTP Client</label>

            </fieldset>
            
            <fieldset>
                <legend>Funding</legend>
                <label>Anticipated completion Date <input type="date" name="completeDate" id=""></label>
                <label>Course Subject
                    <select name="subject" id="">
                        <option value="">Please Select &#9662;</option>
                        <option value="software">Software Development</option>
                        <option value="game">Game Development</option>
                        <option value="data">Data Analysis</option>
                        <option value="web">Full-Stack Web Development</option>
                        <option value="cyber">Cybersecurity</option>
                        <option value="systems">Systems Development</option>
                    </select>
                </label>

                <label>Number of Authors? <input type="number" name="authors" id=""></label>
            </fieldset>

            <input type="submit" value="Propose My Course">
        </form>
    </main>
